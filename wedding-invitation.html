  <style>
    @font-face {
      font-family: 'Brittany Signature';
      src: url('/fonts/BrittanySignature.woff') format('woff'),
        url('fonts/BrittanySignature.woff') format('woff'),
        url('https://fonts.cdnfonts.com/s/39082/BrittanySignature-LjyZ.woff') format('woff');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --ivory: #faf6ee;
      --cream: #f3ece0;
      --blush: #f4e6e0;
      --gold: #b8985a;
      --gold-soft: #dcc9a0;
      --ink: #3b342b;
      --mute: #7d7365;
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans: 'DM Sans', system-ui, sans-serif;
      --script: 'Alex Brush', 'Great Vibes', cursive;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    *,
    *::before,
    *::after {
      box-sizing: inherit
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      margin: 0;
      background: var(--ivory);
      color: var(--ink);
      font-family: var(--sans);
      font-weight: 300;
      line-height: 1.7;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased
    }

    section {
      padding: clamp(72px, 14vw, 140px) 24px;
      text-align: center;
      position: relative
    }

    .wrap {
      max-width: 560px;
      margin: 0 auto
    }

    .label {
      font-size: .7rem;
      letter-spacing: .32em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 400;
      margin: 0 0 28px
    }

    h1,
    h2,
    h3,
    .serif {
      font-family: var(--serif);
      font-weight: 400;
      margin: 0
    }

    .names {
      font-family: var(--script);
      font-weight: 400;
      font-size: clamp(3.2rem, 13vw, 5.2rem);
      line-height: 1.2;
      letter-spacing: .02em
    }

    .intro-names {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      position: relative;
      text-align: center;
      overflow: visible;
    }

    .script-line {
      position: relative;
      display: inline-block;
      line-height: 1.2;
      padding: 0.05em 0.8em;
      overflow: visible;
    }

    .script-text {
      display: inline-block;
      font-family: var(--script);
      font-size: clamp(3.2rem, 12.5vw, 5.2rem);
      font-weight: 400;
      color: var(--ink);
      letter-spacing: .02em;
      white-space: nowrap;
      padding: 0.08em 0.3em;
      margin: -0.08em -0.3em;
      overflow: visible;
      will-change: clip-path, opacity;
    }

    .script-groom .script-text,
    .script-bride .script-text {
      clip-path: inset(-60px 105% -60px -60px);
      opacity: 0;
    }

    .script-amp {
      overflow: visible;
    }

    .script-amp .amp {
      font-family: var(--serif);
      font-style: italic;
      color: var(--gold);
      font-size: clamp(1.6rem, 5.5vw, 2.3rem);
      opacity: 0;
      transform: scale(.6) rotate(-8deg);
      display: block;
      margin: 2px 0;
      transition: transform .6s ease;
    }

    .calligraphy-spark {
      position: absolute;
      top: 52%;
      left: 0;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 8px 2px #fff2a8, 0 0 16px 4px rgba(235, 205, 130, .95), 0 0 24px 6px rgba(212, 175, 55, .85);
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -50%);
      will-change: left, opacity;
    }

    .flourish-wrap {
      width: clamp(200px, 62vw, 300px);
      height: 24px;
      margin: .1rem auto 0;
      overflow: visible;
    }

    .calligraphy-flourish {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .flourish-path {
      stroke-dasharray: 320;
      stroke-dashoffset: 320;
    }

    .intro-names.in .script-groom .script-text {
      animation: writeGroom 1.7s cubic-bezier(.35, 0, .25, 1) .3s forwards;
    }

    .intro-names.in .script-groom .calligraphy-spark {
      animation: sparkMoveGroom 1.7s cubic-bezier(.35, 0, .25, 1) .3s forwards;
    }

    .intro-names.in .script-amp .amp {
      animation: revealAmp .7s cubic-bezier(.34, 1.56, .64, 1) 1.8s forwards;
    }

    .intro-names.in .script-bride .script-text {
      animation: writeBride 1.5s cubic-bezier(.35, 0, .25, 1) 2.3s forwards;
    }

    .intro-names.in .script-bride .calligraphy-spark {
      animation: sparkMoveBride 1.5s cubic-bezier(.35, 0, .25, 1) 2.3s forwards;
    }

    .intro-names.in .flourish-path {
      animation: drawFlourish 1.1s cubic-bezier(.25, 1, .5, 1) 3.6s forwards;
    }

    @keyframes writeGroom {
      0% {
        clip-path: inset(-60px 105% -60px -60px);
        opacity: 1;
      }

      100% {
        clip-path: inset(-60px -60px -60px -60px);
        opacity: 1;
      }
    }

    @keyframes sparkMoveGroom {
      0% {
        left: 0%;
        opacity: 0;
        transform: translate(-50%, -50%) scale(.4);
      }

      6% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.3);
      }

      92% {
        left: 100%;
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.1);
      }

      100% {
        left: 100%;
        opacity: 0;
        transform: translate(-50%, -50%) scale(.2);
      }
    }

    @keyframes revealAmp {
      0% {
        opacity: 0;
        transform: scale(.6) rotate(-8deg);
      }

      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    @keyframes writeBride {
      0% {
        clip-path: inset(-60px 105% -60px -60px);
        opacity: 1;
      }

      100% {
        clip-path: inset(-60px -60px -60px -60px);
        opacity: 1;
      }
    }

    @keyframes sparkMoveBride {
      0% {
        left: 0%;
        opacity: 0;
        transform: translate(-50%, -50%) scale(.4);
      }

      6% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.3);
      }

      92% {
        left: 100%;
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.1);
      }

      100% {
        left: 100%;
        opacity: 0;
        transform: translate(-50%, -50%) scale(.2);
      }
    }

    @keyframes drawFlourish {
      0% {
        stroke-dashoffset: 320;
      }

      100% {
        stroke-dashoffset: 0;
      }
    }

    @media(prefers-reduced-motion:reduce) {

      .script-groom .script-text,
      .script-bride .script-text {
        clip-path: none !important;
        opacity: 1 !important;
        animation: none !important;
      }

      .script-amp .amp {
        opacity: 1 !important;
        transform: none !important;
        animation: none !important;
      }

      .calligraphy-spark {
        display: none !important;
      }

      .flourish-path {
        stroke-dashoffset: 0 !important;
        animation: none !important;
      }
    }

    .amp {
      font-family: var(--serif);
      font-style: italic;
      color: var(--gold);
      font-size: clamp(1.5rem, 5vw, 2rem);
      display: block;
      margin: 6px 0
    }

    .big {
      font-size: clamp(2.3rem, 7vw, 3.2rem);
      line-height: 1.15
    }

    .quote {
      font-family: var(--serif);
      font-style: italic;
      font-size: clamp(1.3rem, 4.6vw, 1.65rem);
      line-height: 1.6;
      max-width: 30ch;
      margin: 0 auto
    }

    .body {
      font-family: var(--serif);
      font-size: clamp(1.25rem, 4.4vw, 1.5rem);
      line-height: 1.7;
      max-width: 34ch;
      margin: 0 auto
    }

    .small {
      font-size: .85rem;
      color: var(--mute);
      letter-spacing: .04em
    }

    .alt {
      background: var(--cream)
    }

    .rule {
      height: 1px;
      width: 64px;
      background: var(--gold);
      margin: 36px auto
    }

    .orn {
      display: block;
      margin: 36px auto;
      width: 150px;
      height: 18px;
      color: var(--gold)
    }

    /* hero */
    #hero {
      position: fixed;
      inset: 0;
      z-index: 20;
      min-height: 100vh;
      min-height: 100svh;
      height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px));
      background: #0f0c09;
      transition: opacity 1.8s cubic-bezier(0.4, 0, 0.2, 1), transform 2s cubic-bezier(0.25, 1, 0.5, 1), visibility 2s;
      will-change: opacity, transform;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center 25%;
      background-repeat: no-repeat;
      pointer-events: none;
      z-index: 0;
      filter: brightness(0.82);
    }

    .hero-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 45%, rgba(14, 11, 8, 0.54) 0%, rgba(7, 5, 4, 0.84) 100%);
    }

    .hero-initial,
    .hero-writing {
      position: relative;
      z-index: 2;
    }

    #hero.leaving {
      opacity: 0;
      transform: scale(1.04) translateY(-26px);
      visibility: hidden;
      pointer-events: none;
    }

    .hero-initial {
      position: absolute;
      bottom: calc(clamp(32px, 8svh, 68px) + env(safe-area-inset-bottom, 0px));
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity .45s ease, transform .45s ease;
      width: 100%;
      padding: 0 20px;
      margin: 0;
      pointer-events: auto;
      z-index: 10;
    }

    .hero-initial.hide {
      opacity: 0;
      transform: translateY(14px);
      pointer-events: none;
    }

    .hero-writing {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 520px;
      margin-top: clamp(28px, 6vh, 60px);
    }

    .hero-writing.in {
      display: flex;
    }

    .hero-title {
      font-family: var(--serif);
      font-size: clamp(1.05rem, 4.4vw, 1.75rem);
      letter-spacing: .24em;
      text-transform: uppercase;
      font-weight: 400;
      color: #e5c583;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.8), 0 0 22px rgba(229, 197, 131, 0.45);
      margin: 0 0 26px;
      padding-left: .24em;
      text-align: center;
      line-height: 1.2;
      white-space: nowrap;
    }

    .hero-writing-label {
      font-size: .7rem;
      letter-spacing: .32em;
      text-transform: uppercase;
      color: var(--gold-soft);
      font-weight: 400;
      margin: 0 0 16px;
      text-shadow: 0 1px 10px rgba(0, 0, 0, 0.7);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px);
      transition: opacity 0.8s ease, transform 0.8s ease, visibility 0.8s;
    }

    .hero-writing.step-label .hero-writing-label {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .hero-writing .script-groom .script-text {
      clip-path: inset(-60px 105% -60px -60px);
      opacity: 0;
    }

    .hero-writing.step-divya .script-groom .script-text {
      animation: writeGroom 1.4s cubic-bezier(.35, 0, .25, 1) forwards;
    }

    .hero-writing.step-divya .script-groom .calligraphy-spark {
      animation: sparkMoveGroom 1.4s cubic-bezier(.35, 0, .25, 1) forwards;
    }

    .hero-writing .script-amp .amp {
      opacity: 0;
      transform: scale(.6) rotate(-8deg);
      transition: opacity 0.5s cubic-bezier(.34, 1.56, .64, 1), transform 0.5s cubic-bezier(.34, 1.56, .64, 1);
    }

    .hero-writing.step-amp .script-amp .amp {
      opacity: 1;
      transform: scale(1) rotate(0deg);
    }

    .hero-writing .script-bride .script-text {
      clip-path: inset(-60px 105% -60px -60px);
      opacity: 0;
    }

    .hero-writing.step-nidhin .script-bride .script-text {
      animation: writeBride 1.4s cubic-bezier(.35, 0, .25, 1) forwards;
    }

    .hero-writing.step-nidhin .script-bride .calligraphy-spark {
      animation: sparkMoveBride 1.4s cubic-bezier(.35, 0, .25, 1) forwards;
    }

    .hero-writing .flourish-path {
      stroke-dasharray: 320;
      stroke-dashoffset: 320;
    }

    .hero-writing.step-flourish .flourish-path {
      animation: drawFlourish 0.9s cubic-bezier(.25, 1, .5, 1) forwards;
    }

    #hero .date {
      color: #fffdf8;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.7);
    }

    #hero .day {
      color: var(--gold-soft);
      letter-spacing: .34em;
    }

    #hero .tag {
      color: rgba(255, 255, 255, 0.82);
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.7);
    }

    #hero .script-text {
      color: #fffaf0;
      text-shadow: 0 2px 24px rgba(220, 201, 160, 0.65), 0 0 12px rgba(255, 255, 255, 0.35);
    }

    #hero .script-amp .amp {
      color: var(--gold-soft);
      text-shadow: 0 2px 16px rgba(184, 152, 90, 0.7);
    }

    .btn-tap {
      position: relative;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #ffffff;
      border: 1px solid var(--gold);
      border-radius: 999px;
      min-height: unset;
      height: 38px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 26px;
      font: 500 .68rem var(--sans);
      letter-spacing: .25em;
      text-transform: uppercase;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35), 0 0 12px rgba(218, 165, 32, 0.25);
      animation: btnPulse 2.4s ease-in-out infinite;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      transition: transform .35s ease, background .35s ease, border-color .35s ease, box-shadow .35s ease;
    }

    /* Generous invisible touch target padding for effortless tapping on all mobile devices */
    .btn-tap::after {
      content: "";
      position: absolute;
      inset: -14px -24px;
      cursor: pointer;
    }

    .btn-tap:hover {
      background: rgba(255, 255, 255, 0.26);
      border-color: #eed79b;
      transform: scale(1.04);
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.45), 0 0 20px rgba(218, 165, 32, 0.45);
    }

    @keyframes btnPulse {
      0%, 100% {
        background: rgba(255, 255, 255, 0.14);
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35), 0 0 12px rgba(218, 165, 32, 0.22);
        border-color: rgba(212, 175, 55, 0.75);
        transform: scale(1);
      }
      50% {
        background: rgba(255, 255, 255, 0.22);
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45), 0 0 20px rgba(218, 165, 32, 0.45);
        border-color: rgba(235, 205, 130, 0.95);
        transform: scale(1.03);
      }
    }

    .hero-writing-date {
      margin-top: 24px;
      text-align: center;
      opacity: 0;
      visibility: hidden;
      transform: translateY(14px);
      transition: opacity 0.85s cubic-bezier(.25, 1, .5, 1), transform 0.85s cubic-bezier(.25, 1, .5, 1), visibility 0.85s;
    }

    .hero-writing.step-date .hero-writing-date {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    @keyframes heroFadeDown {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    @keyframes heroFadeUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    .hwd-day {
      font-family: var(--sans);
      font-size: .75rem;
      letter-spacing: .32em;
      text-transform: uppercase;
      color: var(--gold-soft);
      font-weight: 500;
      margin-bottom: 6px;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.7);
    }

    .hwd-date {
      font-family: var(--serif);
      font-size: clamp(1.4rem, 4.6vw, 1.85rem);
      letter-spacing: .18em;
      text-transform: uppercase;
      color: #fffdf8;
      text-shadow: 0 2px 16px rgba(0, 0, 0, 0.8), 0 0 24px rgba(220, 201, 160, 0.35);
      line-height: 1.2;
    }

    .arch {
      width: min(34vw, 160px, calc(22svh*.75));
      aspect-ratio: 3/4;
      border: 1px solid var(--gold);
      border-radius: 999px 999px 6px 6px;
      padding: 5px;
      margin-bottom: clamp(18px, 4svh, 32px)
    }

    .arch img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 34%;
      border-radius: 999px 999px 3px 3px
    }

    /* cover */
    #intro {
      padding-top: 0;
      padding-left: 0;
      padding-right: 0;
    }

    #intro .wrap {
      padding-left: 24px;
      padding-right: 24px;
    }

    .cover {
      width: 100%;
      max-width: 640px;
      margin: 0 auto -44px;
      aspect-ratio: 3/4;
      overflow: hidden;
      -webkit-mask-image: linear-gradient(to bottom, #000 68%, transparent 100%);
      mask-image: linear-gradient(to bottom, #000 68%, transparent 100%);
    }

    .cover img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 28%;
      transform: scale(1.03);
      transition: transform 2.6s ease;
    }

    .cover.in img {
      transform: none
    }

    @media(prefers-reduced-motion:reduce) {
      .cover img {
        transition: none;
        transform: none
      }
    }

    /* gallery */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    .gal-card {
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 8px 28px rgba(60, 50, 30, .12);
      background: var(--cream);
      border: 1px solid rgba(220, 201, 160, 0.45);
      position: relative;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .gal-card img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.03);
      transition: transform 2.2s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .gal-card.in img {
      transform: none;
    }

    .gal-card:hover {
      box-shadow: 0 12px 34px rgba(60, 50, 30, .18);
    }

    .gal-card:hover img {

      <svg class="btn-wa-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">

<section style="padding-block:clamp(100px,22vw,200px)"><div class="wrap">
  <h2 class="names r" style="font-size:clamp(2.2rem,9vw,3.4rem)">${W.short}</h2>
  <p class="serif r" style="font-size:1.4rem;letter-spacing:.2em;margin-top:24px">${D.dots}</p>
  <div class="rule line-x r"></div>
  <p class="quote r">Together, forever begins here.</p>
  <p class="small r" style="margin-top:28px">With love and blessings</p>
  ${orn}
</div></section>
<div class="scroll-indicator" id="scroll-indicator" aria-hidden="true">
  <div class="scroll-indicator-pill">
    <span class="scroll-indicator-text">Scroll Down</span>
    <svg class="scroll-indicator-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M6 9l6 6 6-6"/>
    </svg>
  </div>
</div>`;
    function fam(f) {
      return `<div class="r">
  <p class="label">${f.title}</p>
  <h3>${f.names}</h3>
  <p>${f.lines.join('<br>')}</p>
</div>` }
    document.getElementById('fmono').textContent = W.footMono;
    document.getElementById('fdate').textContent = D.dotted;

    /* ===== Live Wedding Countdown Timer ===== */
    const targetDate = new Date('2026-11-26T12:12:00+05:30').getTime();
    function updateCountdown() {
      const now = Date.now();
      const diff = targetDate - now;

      if (diff <= 0) {
        ['cd-days', 'cd-hours', 'cd-mins', 'cd-secs'].forEach(id => {
          const el = document.getElementById(id);
          if (el) el.textContent = '00';
        });
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const mins = Math.floor((diff / (1000 * 60)) % 60);
      const secs = Math.floor((diff / 1000) % 60);

      const dEl = document.getElementById('cd-days');
      const hEl = document.getElementById('cd-hours');
      const mEl = document.getElementById('cd-mins');
      const sEl = document.getElementById('cd-secs');

      if (dEl) dEl.textContent = String(days).padStart(2, '0');
      if (hEl) hEl.textContent = String(hours).padStart(2, '0');
      if (mEl) mEl.textContent = String(mins).padStart(2, '0');
      if (sEl) sEl.textContent = String(secs).padStart(2, '0');
    }
    updateCountdown();
    setInterval(updateCountdown, 1000);

    /* ===== Scroll reveal ===== */
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target) } }), { threshold: .15, rootMargin: '0px 0px -6% 0px' });

    /* ===== Prelude: guest taps "Tap to Open" to trigger Brittany writings, then opens slowly ===== */
    history.scrollRestoration = 'manual'; scrollTo(0, 0);
    document.documentElement.style.overflow = 'hidden'; document.body.style.overflow = 'hidden';
    let openingStarted = false;
    let opened = false;

    function startOpeningSequence() {
      if (openingStarted) return;
      openingStarted = true;

      // 1. Play background music on guest tap
      playAudio();

      const heroInitial = document.getElementById('hero-initial');
      const heroWriting = document.getElementById('hero-writing');

      // 2. Hide initial prompt smoothly
      if (heroInitial) {
        heroInitial.classList.add('hide');
      }

      // 3. Reveal writing container and orchestrate strict chronological flow:
      // Step 1: "Together with their families"
      // Step 2: "Ravi"
      // Step 3: "&"
      // Step 4: "Yashaswi"
      // Step 5: Golden Flourish
      // Step 6: "Thursday" & "26 November 2026"
      // Step 7: Open invitation slowly
      setTimeout(() => {
        if (heroInitial) heroInitial.style.display = 'none';
        if (heroWriting) {
          heroWriting.style.display = 'flex';
          void heroWriting.offsetWidth;

          // Step 1: "Together with their families" fades down
          setTimeout(() => {
            heroWriting.classList.add('step-label');
          }, 150);

          // Step 2: "Ravi" writes in Brittany Signature
          setTimeout(() => {
            heroWriting.classList.add('step-divya');
          }, 1000);

          // Step 3: "&" reveals
          setTimeout(() => {
            heroWriting.classList.add('step-amp');
          }, 2500);

          // Step 4: "Yashaswi" writes in Brittany Signature
          setTimeout(() => {
            heroWriting.classList.add('step-nidhin');
          }, 3100);

          // Step 5: Golden flourish draws under names
          setTimeout(() => {
            heroWriting.classList.add('step-flourish');
          }, 4600);

          // Step 6: "Thursday" & "26 November 2026" rises into view
          setTimeout(() => {
            heroWriting.classList.add('step-date');
          }, 5500);

          // Step 7: Pause to appreciate completed view, then open invitation slowly
          setTimeout(() => {
            openInviteSlowly();
          }, 8200);
        }
      }, 350);
    }

    function openInviteSlowly() {
      if (opened) return;
      opened = true;

      const hero = document.getElementById('hero');
      if (hero) hero.classList.add('leaving');

      document.documentElement.style.overflow = '';
      document.body.style.overflow = '';
      scrollTo(0, 0);

      document.querySelectorAll('.r').forEach(el => io.observe(el));

      setTimeout(() => {
        const inames = document.querySelector('#intro .intro-names');
        if (inames) inames.classList.add('in');
        const scrollIndicator = document.getElementById('scroll-indicator');
        if (scrollIndicator) scrollIndicator.classList.add('visible');
      }, 500);
    }

    /* ===== Scroll Down Indicator Handler ===== */
    const scrollIndicator = document.getElementById('scroll-indicator');
    if (scrollIndicator) {
      window.addEventListener('scroll', () => {
        if (window.scrollY > 40) {
          scrollIndicator.classList.add('hide');
        } else if (opened) {
          scrollIndicator.classList.remove('hide');
        }
      }, { passive: true });
    }

    /* ===== Universal Tap Handling (Works across all mobile devices, tablets & browsers) ===== */
    function triggerOpen(e) {
      if (e) {
        if (e.cancelable && e.type !== 'touchmove') {
          e.preventDefault();
        }
      }
      if (!openingStarted) {
        startOpeningSequence();
      } else if (!opened) {
        openInviteSlowly();
      }
    }

    const btnOpen = document.getElementById('btn-open');
    if (btnOpen) {
      btnOpen.addEventListener('click', triggerOpen);
      btnOpen.addEventListener('touchend', triggerOpen, { passive: false });
    }

    const heroEl = document.getElementById('hero');
    if (heroEl) {
      // Tapping anywhere on the screen (photo, background, text) opens the invitation
      heroEl.addEventListener('click', e => {
        if (e.target !== btnOpen) triggerOpen(e);
      });
      heroEl.addEventListener('touchend', e => {
        if (e.target !== btnOpen && !openingStarted) triggerOpen(e);
      }, { passive: false });

      // Swipe up support: if guest attempts to scroll down, naturally open the invitation
      let touchStartY = 0;
      heroEl.addEventListener('touchstart', e => {
        if (e.touches && e.touches[0]) touchStartY = e.touches[0].clientY;
      }, { passive: true });

      heroEl.addEventListener('touchmove', e => {
        if (e.touches && e.touches[0]) {
          const deltaY = touchStartY - e.touches[0].clientY;
          if (Math.abs(deltaY) > 25 && !openingStarted) {
            triggerOpen(e);
          }
        }
      }, { passive: true });
    }

    /* ===== Smart WhatsApp RSVP Handler ===== */
    const btnRsvp = document.getElementById('btn-rsvp-wa');
    if (btnRsvp) {
      btnRsvp.addEventListener('click', function (e) {
        e.preventDefault();
        const phone = "91" + W.rsvpPhone;
        const text = encodeURIComponent(W.rsvpMsg);
        const nativeUrl = `whatsapp://send?phone=${phone}&text=${text}`;
        const webUrl = `https://api.whatsapp.com/send/?phone=${phone}&text=${text}`;

        // Directly open WhatsApp application (Mac / Windows desktop app, or iOS / Android mobile app).
        // This lands directly in the chat with +91 9620378277 and the full text + ribbon heart emoji 💝 intact,
        // avoiding both WhatsApp Web's QR code login trap and Meta's web server emoji corruption bug.
        window.location.href = nativeUrl;

        // Fallback for browsers/devices without the WhatsApp app installed:
        const fallbackTimer = setTimeout(() => {
          if (!document.hidden) {
            window.location.href = webUrl;
          }
        }, 1800);

        window.addEventListener('blur', () => clearTimeout(fallbackTimer), { once: true });
        window.addEventListener('pagehide', () => clearTimeout(fallbackTimer), { once: true });
      });
    }

    /* ===== Background Music Playback ===== */
    const audio = document.getElementById('wedding-audio');

    function playAudio() {
      if (!audio) return;
      const playPromise = audio.play();
      if (playPromise !== undefined) {
        playPromise.catch(err => {
          console.log("Audio waiting for user gesture:", err);
          const resume = () => {
            audio.play().catch(() => { });
            window.removeEventListener('click', resume);
            window.removeEventListener('touchstart', resume);
          };
          window.addEventListener('click', resume, { once: true });
          window.addEventListener('touchstart', resume, { once: true });
        });
      }
    }
  </script>
</body>

</html>
